  }
  // love meter — bottom center
  const lw = 190, lx0 = W / 2 - lw / 2, ly0 = H - 26;
  ctx.fillStyle = "rgba(10,5,18,0.5)";
  roundRect(lx0 - 26, ly0 - 11, lw + 38, 22, 11); ctx.fill();
  ctx.save(); ctx.translate(lx0 - 12, ly0); ctx.scale(1.05, 1.05);
  ctx.fillStyle = love >= 100 || loveTime > 0 ? `hsl(${(t * 6) % 360},95%,70%)` : "#ff5e8a";
  ctx.beginPath(); ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-9, -2, -5, -10, 0, -4); ctx.bezierCurveTo(5, -10, 9, -2, 0, 6); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,0.16)";
  roundRect(lx0, ly0 - 5, lw, 10, 5); ctx.fill();
  const fillW = loveTime > 0 ? lw * (loveTime / 480) : lw * (love / 100);
  const lg = ctx.createLinearGradient(lx0, 0, lx0 + lw, 0);
  lg.addColorStop(0, "#ff5e8a"); lg.addColorStop(1, "#ffb0d8");
  ctx.fillStyle = loveTime > 0 ? `hsl(${(t * 6) % 360},95%,70%)` : lg;
  if (fillW > 4) { roundRect(lx0, ly0 - 5, fillW, 10, 5); ctx.fill(); }
  txt(loveTime > 0 ? "ALOHA OVERDRIVE!" : love >= 100 ? "LOVE MAX — V / ♥" : "LOVE " + Math.floor(love) + "%", W / 2, ly0 - 12, "bold 10px 'Trebuchet MS'", love >= 100 || loveTime > 0 ? "#ffd75e" : "#ffb0d8");
  // bomb + love buttons
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = "#0a2a3a"; ctx.beginPath(); ctx.arc(W - 48, H - 54, 32, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgb(" + BOMBS[player.weapon].col + ")"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W - 48, H - 54, 32, 0, TAU); ctx.stroke();
  ctx.fillStyle = love >= 100 ? "rgba(80,20,50,0.9)" : "#2a0a20";
  ctx.beginPath(); ctx.arc(48, H - 54, 32, 0, TAU); ctx.fill();
  ctx.strokeStyle = love >= 100 ? `hsl(${(t * 6) % 360},95%,70%)` : "#ff8fc7";
  ctx.beginPath(); ctx.arc(48, H - 54, 32 + (love >= 100 ? Math.sin(t * 0.2) * 3 : 0), 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
  txt("BOMB", W - 48, H - 56, "bold 12px 'Trebuchet MS'", "rgb(" + BOMBS[player.weapon].col + ")");
  txt("×" + player.bombs, W - 48, H - 42, "11px 'Trebuchet MS'", "rgb(" + BOMBS[player.weapon].col + ")");
  txt("♥", 48, H - 48, "bold 26px 'Trebuchet MS'", love >= 100 ? `hsl(${(t * 6) % 360},95%,70%)` : "#ff8fc7");
  if (bossWarnT > 0 && (bossWarnT >> 4) % 2 === 0) {
    txt("⚠ " + BOSS_INFO[STAGES[stageIdx()].boss].name + " APPROACHES ⚠", W / 2, 300, "bold 24px 'Trebuchet MS'", "rgba(255,40,30,0.85)");
    txt(STAGES[stageIdx()].lore, W / 2, 330, "italic 14px 'Trebuchet MS'", "#ffd2a8");
  }
  if (stageIntroT > 0 && stageIntroT < 160) {
    const a = clamp(Math.min(stageIntroT, 160 - stageIntroT) / 30, 0, 1);
    ctx.globalAlpha = a;
    txt("STAGE " + (stageIdx() + 1) + (loopN() > 0 ? " · LOOP " + (loopN() + 1) : ""), W / 2, 280, "bold 30px 'Trebuchet MS'", "#ffd75e");
    txt(STAGES[stageIdx()].name, W / 2, 312, "italic 19px 'Trebuchet MS'", "#fff");
    txt(STAGES[stageIdx()].lore, W / 2, 338, "italic 13px 'Trebuchet MS'", "#ffd2a8");
    ctx.globalAlpha = 1;
  }
  if (stageClearT > 0 && stageClearT < 230) {
    txt("STAGE CLEAR!", W / 2, 286, "bold 34px 'Trebuchet MS'", "#ffd75e");
    const mc = { GOLD: "#ffd75e", SILVER: "#d8e2e8", BRONZE: "#c8862a" }[clearMedal];
    txt(clearMedal + " MEDAL  +" + clearBonus, W / 2, 318, "bold 19px 'Trebuchet MS'", mc);
    txt("Mahalo! Onward to the next island…", W / 2, 344, "14px 'Trebuchet MS'", "#fff");
  }
  if (lovePop > 0) {
    const s = 1 + (60 - lovePop) * 0.012;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 60);
    ctx.scale(s, s);
    ctx.globalAlpha = clamp(lovePop / 30, 0, 1);
    drawPhotoCircle(0, 0, 44);
    txt("❤", 0, 70, "bold 34px 'Trebuchet MS'", `hsl(${(t * 8) % 360},95%,70%)`);
    ctx.restore();
  }
  if (paused) {
    ctx.fillStyle = "rgba(8,4,16,0.6)"; ctx.fillRect(0, 0, W, H);
    txt("PAUSED — HO'OMAHA", W / 2, 340, "bold 28px 'Trebuchet MS'", "#fff");
    txt("press P to resume", W / 2, 372, "15px 'Trebuchet MS'", "#ffd2a8");
  }
}
function drawToasts() {
  toasts.slice(0, 3).forEach((to, i) => {
    const a = clamp(Math.min(to.t, 220 - to.t) / 25, 0, 1);
    ctx.globalAlpha = a;
    const y = 88 + i * 46;
    ctx.fillStyle = "rgba(20,10,30,0.8)";
    roundRect(W / 2 - 130, y - 16, 260, 38, 9); ctx.fill();
    ctx.strokeStyle = "#ffd75e"; ctx.lineWidth = 1.5; ctx.stroke();
    txt(to.txt, W / 2, y, "bold 14px 'Trebuchet MS'", "#ffd75e");
    txt(to.sub, W / 2, y + 15, "11px 'Trebuchet MS'", "#ffd2a8");
    ctx.globalAlpha = 1;
  });
}
function drawParticles() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / 25, 0, 1) * (p.smoke ? 0.6 : 1);
    if (p.ring) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life / 25, 0, 1);
    txt(f.txt, f.x, f.y, "bold 15px 'Trebuchet MS'", f.color);
  }
  ctx.globalAlpha = 1;
}
function drawPetals() {
  for (const p of petals) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.a);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = "#fff0f5";
    ctx.beginPath(); ctx.ellipse(0, 0, 3, 5.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffd75e";
    ctx.beginPath(); ctx.arc(0, 4, 1.2, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ================= Screens =================
function drawTitle() {
  drawOcean();
  for (const s of islands) drawIsland(s);
  for (const c of clouds) drawCloud(c);
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.translate(W / 2, 158);
  ctx.scale(1.15, 1.15);
  ctx.fillStyle = "#3b2f33";
  ctx.beginPath();
  ctx.moveTo(-150, 60); ctx.lineTo(-40, -70); ctx.lineTo(-10, -82); ctx.lineTo(20, -74); ctx.lineTo(150, 60);
  ctx.closePath(); ctx.fill();
  const gl = 0.6 + Math.sin(t * 0.08) * 0.25;
  const cg = ctx.createRadialGradient(0, -78, 4, 0, -78, 70);
  cg.addColorStop(0, `rgba(255,220,140,${gl})`); cg.addColorStop(0.4, `rgba(255,110,40,${gl * 0.7})`); cg.addColorStop(1, "rgba(255,80,30,0)");
  ctx.fillStyle = cg; ctx.fillRect(-80, -150, 160, 150);
  ctx.restore();
  if (t % 3 === 0 && CFG.particles === "high")
    parts.push({ x: W / 2 + rand(-22, 22), y: 78, vx: rand(-1, 1), vy: rand(-3.4, -1.4), life: rand(30, 60), color: pick(["#ff9b40", "#ffd75e"]), size: rand(2, 5), grav: 0.06 });
  drawParticles();
  drawPetals();
  ctx.fillStyle = "rgba(8,4,16,0.5)"; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = "#ff66cc"; ctx.shadowBlur = 24;
  txt("ALOHA RAIDERS II", W / 2, 92, "bold 44px 'Trebuchet MS'", "#ffd75e");
  ctx.restore();
  txt("~ Legends of the Islands ~", W / 2, 124, "italic 20px 'Trebuchet MS'", "#ff8fc7");
  drawPolaroid(W / 2 - 70, 260, 124, -0.06, "our fearless pilots ♥");
  drawShip(W / 2 + 110, 250 + Math.sin(t * 0.05) * 8, 1.45, Math.sin(t * 0.03) * 3);
  txt("PILOT RANK: " + rankTitle(), W / 2, 372, "bold 14px 'Trebuchet MS'", "#7dff9b");
  txt("Five mythic guardians bar your honeymoon flight:", W / 2, 402, "14px 'Trebuchet MS'", "#fff");
  txt("Pele · Kanaloa · the Night Marchers · Kamapua'a · the Mo'o", W / 2, 422, "italic 13px 'Trebuchet MS'", "#ffd2a8");
  txt("3 weapons · missiles · menehune wingmen · honu shields", W / 2, 448, "13px 'Trebuchet MS'", "#9be8ff");
  txt("Graze bullets & collect hearts to charge LOVE POWER ❤", W / 2, 468, "13px 'Trebuchet MS'", "#ff8fc7");
  txt("Arrows/WASD · Shift focus · B bomb · V love · P pause · M music", W / 2, 494, "12px 'Trebuchet MS'", "rgba(255,255,255,0.75)");
  txt(Math.sin(t * 0.1) > 0 ? "PRESS SPACE or TAP TO LAUNCH" : "· · ·", W / 2, 548, "bold 23px 'Trebuchet MS'", Math.sin(t * 0.1) > 0 ? "#fff" : "#ffd75e");
  txt("HI-SCORE  " + SAVE.best + "   ·   DIFFICULTY: " + DIFFS[CFG.diff].label.toUpperCase(), W / 2, 588, "14px 'Trebuchet MS'", "#ffd75e");
  // menu buttons
  for (const [bx, label] of [[120, "⚙ CONFIG [C]"], [360, "🏆 FEATS [A] " + achCount() + "/" + ACHS.length]]) {
    ctx.fillStyle = "rgba(20,10,30,0.7)";
    roundRect(bx - 70, 638, 140, 40, 10); ctx.fill();
    ctx.strokeStyle = "#ff8fc7"; ctx.lineWidth = 1.5; ctx.stroke();
    txt(label, bx, 663, "bold 13px 'Trebuchet MS'", "#fff");
  }
  txt(musicOn && CFG.musicVol > 0 ? "♪ music on (M)" : "♪ music off (M)", W / 2, 706, "11px 'Trebuchet MS'", "rgba(255,255,255,0.5)");
  drawToasts();
}
function drawConfig() {
  drawOcean();
  for (const c of clouds) drawCloud(c);
  ctx.fillStyle = "rgba(8,4,16,0.66)"; ctx.fillRect(0, 0, W, H);
  txt("⚙ CONFIG", W / 2, 120, "bold 36px 'Trebuchet MS'", "#ffd75e");
  txt("arrows + enter · or tap a row", W / 2, 150, "13px 'Trebuchet MS'", "#ffd2a8");
  CFG_ROWS.forEach((r, i) => {
    const y = CFG_Y0 + i * CFG_DY;
    if (i === cfgSel) {
      ctx.fillStyle = "rgba(255,143,199,0.16)";
      roundRect(40, y - 24, W - 80, 42, 9); ctx.fill();
      ctx.strokeStyle = "#ff8fc7"; ctx.lineWidth = 1.5; ctx.stroke();
    }
    txt(r.label, 60, y + 4, "bold 17px 'Trebuchet MS'", i === cfgSel ? "#fff" : "#ffd2a8", "left");
    txt(r.get(), W - 60, y + 4, "bold 17px 'Trebuchet MS'", "#9be8ff", "right");
  });
  txt("Difficulty applies on next launch", W / 2, CFG_Y0 + CFG_ROWS.length * CFG_DY + 26, "12px 'Trebuchet MS'", "rgba(255,255,255,0.55)");
}
function drawAch() {
  drawOcean();
  for (const c of clouds) drawCloud(c);
  ctx.fillStyle = "rgba(8,4,16,0.7)"; ctx.fillRect(0, 0, W, H);
  txt("🏆 FEATS OF LEGEND  " + achCount() + "/" + ACHS.length, W / 2, 84, "bold 26px 'Trebuchet MS'", "#ffd75e");
  ACHS.forEach((a, i) => {
    const done = !!SAVE.ach[a[0]];
    const y = 130 + i * 44;
    ctx.fillStyle = done ? "rgba(255,215,94,0.12)" : "rgba(255,255,255,0.05)";
    roundRect(36, y - 17, W - 72, 38, 8); ctx.fill();
    txt(done ? "✓" : "·", 56, y + 5, "bold 19px 'Trebuchet MS'", done ? "#7dff9b" : "#666");
    txt(a[1], 76, y - 1, "bold 14px 'Trebuchet MS'", done ? "#ffd75e" : "#999", "left");
    txt(a[2], 76, y + 13, "11px 'Trebuchet MS'", done ? "#ffd2a8" : "#777", "left");
  });
  const s = SAVE.stats;
  txt("kills " + s.kills + " · bosses " + s.bosses + " · grazes " + s.grazes + " · max chain " + s.maxChain + " · loves " + s.loves, W / 2, 686, "12px 'Trebuchet MS'", "#9be8ff");
  txt("tap / ESC to return", W / 2, 706, "12px 'Trebuchet MS'", "rgba(255,255,255,0.6)");
}
function drawOver() {
  drawOcean();
  for (const s of islands) drawIsland(s);
  if (boss) drawBoss();
  drawParticles();
  for (const c of clouds) drawCloud(c);
  ctx.fillStyle = "rgba(8,4,16,0.62)"; ctx.fillRect(0, 0, W, H);
  txt("ALOHA 'OE", W / 2, 118, "bold 44px 'Trebuchet MS'", "#ff8fc7");
  txt("until we meet again…", W / 2, 146, "italic 16px 'Trebuchet MS'", "rgba(255,255,255,0.75)");
  drawPolaroid(W / 2, 290, 130, 0.05, "the legend continues ♥");
  txt("SCORE  " + score, W / 2, 432, "24px 'Trebuchet MS'", "#fff");
  txt("Stage " + (stageIdx() + 1) + (loopN() > 0 ? " · Loop " + (loopN() + 1) : "") + " · " + STAGES[stageIdx()].name, W / 2, 460, "15px 'Trebuchet MS'", "#ffd2a8");
  txt("max chain ×" + SAVE.stats.maxChain + " · rank: " + rankTitle(), W / 2, 484, "13px 'Trebuchet MS'", "#9be8ff");
  if (score >= SAVE.best && score > 0) txt("★ NEW HI-SCORE ★", W / 2, 520, "bold 21px 'Trebuchet MS'", "#ffd75e");
  else txt("HI-SCORE  " + SAVE.best, W / 2, 516, "15px 'Trebuchet MS'", "#ffd75e");
  txt(Math.sin(t * 0.1) > 0 ? "PRESS SPACE or TAP TO FLY AGAIN" : "· · ·", W / 2, 580, "bold 22px 'Trebuchet MS'", "#fff");
  drawToasts();
}

// ================= Render =================
function render() {
  ctx.save();
  if (shake > 0 && CFG.shake) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  if (state === ST.TITLE) { drawTitle(); ctx.restore(); return; }
  if (state === ST.CONFIG) { drawConfig(); ctx.restore(); return; }
  if (state === ST.ACH) { drawAch(); ctx.restore(); return; }
  if (state === ST.OVER) { drawOver(); ctx.restore(); return; }
  drawOcean();
  for (const s of islands) drawIsland(s);
  if (boss) drawBoss();
  for (const p of pu) drawPowerup(p);
  for (const e of en) drawEnemy(e);
  drawPlayer();
  drawBullets();
  drawParticles();
  drawPetals();
  for (const c of clouds) drawCloud(c);
  if (bombFx > 0) {
    const pr = (60 - bombFx) / 60;
    const col = BOMBS[bombKind].col;
    ctx.strokeStyle = `rgba(${col},${1 - pr})`;
    ctx.lineWidth = 14 * (1 - pr) + 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, pr * 620, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${(1 - pr) * 0.7})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, pr * 560, 0, TAU); ctx.stroke();
  }
  drawHUD();
  drawToasts();
  if (flashT > 0) {
    ctx.fillStyle = `rgba(${flashCol},${flashT / 12 * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.78);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(5,2,12,0.42)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ================= Loop =================
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
for (let i = 0; i < 5; i++) clouds.push(newCloud(rand(0, H)));
islands.push(newIsland(rand(H * 0.55, H * 0.8)));
loop();

})();
</script>
